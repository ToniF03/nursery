# Schema source for assets/images/database_architecture.svg
# Add tables under `tables` and relationships under `relationships`.
tables:
  - name: userData
    side: left
    columns:
      - name: id
        type: uuid
        key: PK
      - name: created_at
        type: timestamptz
      - name: company
        type: text
      - name: role
        type: text
      - name: birthday
        type: date
      - name: first_name
        type: text
      - name: last_name
        type: text

  - name: wardData
    side: left
    columns:
      - name: id
        type: int
        key: PK
      - name: name
        type: text
      - name: currentCapacity
        type: int4
      - name: maxCapacity
        type: int4
      - name: ResidentialAreaManager
        type: uuid
        key: FK

  - name: auth.users
    side: right
    columns:
      - name: uid
        type: uuid
        key: PK
      - name: displayName
        type: text
      - name: email
        type: text
      - name: phone
        type: text

relationships:
  - from: userData.id
    to: auth.users.uid
  - from: wardData.ResidentialAreaManager
    to: auth.users.uid
