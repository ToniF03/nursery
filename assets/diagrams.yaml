use_cases:
  actor: Healthcare professional
  external_actors:
    - Supabase Authentication
    - Supabase Database
    - Device locale
  use_cases:
    - Register account
    - Sign in
    - Check authentication session
    - View dashboard overview
    - View current time and staff ratio
    - View alerts and shift timeline
    - Open account menu
    - View profile information
    - Sign out
    - Use quick action
    - Display not-implemented dialog
    - Use localized interface
  actor_links:
    - Healthcare professional -> Register account
    - Healthcare professional -> Sign in
    - Healthcare professional -> View dashboard overview
    - Healthcare professional -> Open account menu
    - Healthcare professional -> Sign out
    - Healthcare professional -> Use quick action
    - Device locale -> Use localized interface
  external_links:
    - Sign in -> Supabase Authentication
    - Register account -> Supabase Authentication
    - Check authentication session -> Supabase Authentication
    - Sign out -> Supabase Authentication
    - Register account -> Supabase Database
    - View profile information -> Supabase Database
    - Check authentication session -> Supabase Database
  includes:
    - Sign in -> Check authentication session
    - Check authentication session -> View dashboard overview
    - View dashboard overview -> View current time and staff ratio
    - View dashboard overview -> View alerts and shift timeline
    - Open account menu -> View profile information
    - Use quick action -> Display not-implemented dialog

classes:
  - name: Nursery
    group: Application
    methods:
      - build(context) Widget
  - name: MyHomePage
    group: Application
    fields:
      - title String
    methods:
      - initState() void
      - dispose() void
      - build(context) Widget
  - name: AuthGate
    group: Application
    fields:
      - onAuthStateChanged ValueChanged<bool>
    methods:
      - build(context) Widget
  - name: LoginScreen
    group: Authentication
    fields:
      - onLoginSuccess VoidCallback
    methods:
      - signInWithEmail(email, password) Future<void>
      - build(context) Widget
  - name: RegisterPage
    group: Authentication
    fields:
      - onLoginSuccess VoidCallback
    methods:
      - signUpWithEmail(...) Future<void>
      - build(context) Widget
  - name: Dashboard
    group: Dashboard
    methods:
      - build(context) Widget
  - name: DashboardTopBar
    group: Dashboard
    methods:
      - build(context) Widget
  - name: DashboardInfoBar
    group: Dashboard
    methods:
      - initState() void
      - dispose() void
      - build(context) Widget
  - name: DashboardQuickActions
    group: Dashboard
    methods:
      - build(context) Widget
  - name: UserMenuPage
    group: Dashboard
    methods:
      - getUserName() Future<void>
      - navigateToFirst() void
      - build(context) Widget
  - name: DashboardInfoCard
    group: Widgets
    fields:
      - icon IconData
      - label String
      - value String
      - onTap VoidCallback?
    methods:
      - build(context) Widget
  - name: QuickActionButton
    group: Widgets
    fields:
      - icon IconData
      - label String
      - onPressed VoidCallback
    methods:
      - build(context) Widget
  - name: HorizontalFadeList
    group: Widgets
    fields:
      - children List<Widget>
    methods:
      - build(context) Widget
  - name: AlertCard
    group: Widgets
    fields:
      - title String
      - subtitle String
      - description String
      - color Color
      - data Object?
      - onTap VoidCallback?
    methods:
      - build(context) Widget
  - name: Timeline
    group: Widgets
    fields:
      - children List<TimelineItem>
      - title String?
      - accentColor Color
    methods:
      - build(context) Widget
  - name: TimelineItem
    group: Widgets
    fields:
      - child Widget
      - color Color
      - isFirst bool
      - isLast bool
    methods:
      - build(context) Widget
  - name: Pill
    group: Widgets
    fields:
      - text String
      - bold bool
      - color Color
    methods:
      - build(context) Widget
  - name: NotImplementedDialog
    group: Widgets
    methods:
      - build(context) Widget
  - name: UserButton
    group: Widgets
    methods:
      - build(context) Widget
  - name: AppLocalizations
    group: Services
    abstract: true
    fields:
      - localeName String
    methods:
      - of(context) AppLocalizations?
      - supportedLocales List<Locale>
  - name: AppLocalizationsEn
    group: Services
  - name: AppLocalizationsDe
    group: Services
  - name: Globals
    group: Services
    fields:
      - currentUser Map<String, dynamic>?
      - userName String?
      - fullName String?
  - name: AuthService
    group: Services
    fields:
      - instance AuthService
    methods:
      - signOut() Future<void>
      - onLogout VoidCallback?
  - name: SupabaseClient
    group: Services
    fields:
      - auth GoTrueClient
    methods:
      - from(table) PostgrestQueryBuilder

class_relationships:
  - from: Nursery
    to: MyHomePage
    label: starts
  - from: MyHomePage
    to: AuthGate
    label: contains
  - from: AuthGate
    to: LoginScreen
    label: shows unauthenticated
  - from: AuthGate
    to: Dashboard
    label: shows authenticated
  - from: LoginScreen
    to: RegisterPage
    label: opens
  - from: Dashboard
    to: DashboardTopBar
    label: contains
  - from: Dashboard
    to: DashboardInfoBar
    label: contains
  - from: Dashboard
    to: DashboardQuickActions
    label: contains
  - from: DashboardInfoBar
    to: DashboardInfoCard
    label: contains
  - from: DashboardQuickActions
    to: QuickActionButton
    label: contains
  - from: Dashboard
    to: AlertCard
    label: displays
  - from: Dashboard
    to: Timeline
    label: displays
  - from: Timeline
    to: TimelineItem
    label: contains
  - from: DashboardTopBar
    to: UserButton
    label: contains
  - from: UserMenuPage
    to: AuthService
    label: signs out
  - from: AuthGate
    to: SupabaseClient
    label: observes session
  - from: AuthGate
    to: Globals
    label: updates profile
  - from: AuthService
    to: SupabaseClient
    label: uses
  - from: Nursery
    to: AppLocalizations
    label: configures
  - from: AppLocalizationsEn
    to: AppLocalizations
    label: implements
  - from: AppLocalizationsDe
    to: AppLocalizations
    label: implements
