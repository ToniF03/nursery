name: Update Project Versions

on:
  push:
    branches: [ main ]
    paths:
      - '.metadata'

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions from .metadata & update files
        run: |
          REV=$(grep -A 2 "^version:" .metadata | grep "revision:" | awk '{print $2}')
          RELEASE_INFO=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | jq --arg rev "$REV" '.releases[] | select(.hash == $rev)')
          
          FLUTTER_VER=$(echo "$RELEASE_INFO" | jq -r '.version')
          DART_VER=$(echo "$RELEASE_INFO" | jq -r '.dart_sdk_version' | awk '{print $1}')
          
          if [ -z "$FLUTTER_VER" ] || [ "$FLUTTER_VER" == "null" ]; then
            echo "Could not resolve Flutter version."
            exit 1
          fi

          # 1. Update README.md
          sed -i "s/- \*\*Flutter SDK\*\*: \`>=.*\`/- **Flutter SDK**: \`>=${FLUTTER_VER}\`/g" README.md
          sed -i "s/- \*\*Dart SDK\*\*: .*/- **Dart SDK**: \`>=${DART_VER}\` (included with Flutter)/g" README.md
          sed -i "s|- \[Flutter\](https://flutter.dev/) - .*|- [Flutter](https://flutter.dev/) (${FLUTTER_VER}) - Cross-platform UI framework|g" README.md
          sed -i "s|- \[Dart\](https://dart.dev/) - .*|- [Dart](https://dart.dev/) (${DART_VER}) - Modern, strongly-typed programming language|g" README.md
          sed -i "s/\*\*Built with\*\*: Flutter .*/**Built with**: Flutter ${FLUTTER_VER} \& Dart ${DART_VER}  /g" README.md

          # 2. Update Typst variables
          sed -i "s/#let flutterVersion = \".*\"/#let flutterVersion = \"${FLUTTER_VER}\"/g" path/to/your/file.typ
          sed -i "s/#let dartVersion = \".*\"/#let dartVersion = \"${DART_VER}\"/g" path/to/your/file.typ

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update Flutter & Dart versions in README and Typst docs"
          file_pattern: "README.md path/to/your/file.typ"
