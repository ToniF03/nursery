
name: Build Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Determine APK name
        id: version
        run: |
          echo "name=app-debug.apk" >> $GITHUB_OUTPUT

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy APK into repository
        run: |
          mkdir -p repo/debug
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "repo/debug/${{ steps.version.outputs.name }}"

      - name: Commit and push APK
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add releases/

          if ! git diff --cached --quiet; then
            git commit -m "Build APK ${{ github.ref_name }}"
            git push origin main
          else
            echo "No changes to commit."
          fi
