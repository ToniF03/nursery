
name: Build Typst document

on:
  push:
    paths:
      - 'assets/documentation.typ'
      - 'assets/template.typ'
      - '.github/workflows/main.yml'
      - 'pubspec.yaml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Project Versions"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build_typst_documents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Typst
        uses: lvignoli/typst-action@main
        env:
          TYPST_FONT_PATHS: fonts/
        with:
          source_file: assets/documentation.typ

      - name: Commit generated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: generated PDF from Typst source"
          file_pattern: "README.md assets/documentation.pdf"
