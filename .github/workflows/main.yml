
name: Build Typst document

on:
  push:
    paths:
      - 'assets/documentation.typ'
      - 'assets/template.typ'
    paths-ignore:
      - 'assets/documentation.pdf'

permissions:
  contents: write

jobs:
  build_typst_documents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Typst
        uses: lvignoli/typst-action@main
        env:
          TYPST_FONT_PATHS: fonts/
        with:
          source_file: assets/documentation.typ

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/documentation.pdf

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: update generated PDF"
          git push
